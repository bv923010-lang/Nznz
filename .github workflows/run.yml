name: 🤖 BELAL BOTX666 — Run Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 */6 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: "📥 Code ডাউনলোড"
        uses: actions/checkout@v4

      - name: "⚙️ Node.js সেটআপ"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "🔧 System tools"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3 build-essential

      - name: "🔐 AppState সেটআপ"
        run: echo '${{ secrets.APPSTATE }}' > appstate.json

      - name: "⚙️ Config API Keys"
        run: |
          node -e "
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('config.json','utf-8'));
          config.APIKEYS.GROQ = process.env.GROQ_KEY || config.APIKEYS.GROQ;
          config.APIKEYS.GEMINI = process.env.GEMINI_KEY || config.APIKEYS.GEMINI;
          fs.writeFileSync('config.json', JSON.stringify(config, null, 2));
          console.log('✅ Config সেটআপ সফল!');
          "
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}

      - name: "📦 Dependencies ইনস্টল"
        run: npm install --legacy-peer-deps --no-fund --no-audit

      - name: "🚀 Bot চালু"
        run: node index.js
        timeout-minutes: 350
        env:
          NODE_ENV: production
          TZ: Asia/Dhaka
